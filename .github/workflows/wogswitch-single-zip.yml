name: Deliver WogSwitch single ZIP
on:
  push:
    branches:
      - codex/wogswitch-single-zip-delivery
    paths:
      - .github/workflows/wogswitch-single-zip.yml
permissions:
  contents: write
jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assemble, upload, and download-verify the single ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, urllib.request, urllib.error, urllib.parse, zipfile
          from pathlib import Path
          
          REPO = "JungKwanRyu/gpt1"
          RELEASE = 425960140
          NAME = "WogSwitchProbe-0.5.1.zip"
          EXPECTED = "653c9100b84e6396636bfd11468d70ed3ede04f8daa2b8edad7400d181e55264"
          PARTS = [{"id":722393623,"name":"WogSwitchProbe-0.5.1.transfer.001","size":5242880,"digest":"sha256:b74200f8b306ab9c6460681f59db3325f29fc7d22e0f44244ff3cf2f2865c470"},{"id":722393694,"name":"WogSwitchProbe-0.5.1.transfer.002","size":5242880,"digest":"sha256:d14a0e36ac40a09f3ce254fbecfb05af25b1704e11e4d74c1cd5a83a87d0fe5d"},{"id":722393749,"name":"WogSwitchProbe-0.5.1.transfer.003","size":5242880,"digest":"sha256:860883f63519f270355283d338362f87ac32a2379a1fd4cf8fa2c0c250ae8da7"},{"id":722393810,"name":"WogSwitchProbe-0.5.1.transfer.004","size":5242880,"digest":"sha256:fdb66f44f1040db57aabedd289e64d5c0bad691eb2f3e875e87345ba55f54b4c"},{"id":722393852,"name":"WogSwitchProbe-0.5.1.transfer.005","size":5242880,"digest":"sha256:fe2a0e80806560f7a4fcb65ad0f7f8f6ad975c85ea8f8a96156961d5a0354aeb"},{"id":722393896,"name":"WogSwitchProbe-0.5.1.transfer.006","size":5242880,"digest":"sha256:9c441a6e4a20892d5cafd5a4568dff4ddeaf2d2dfecf6cfe33523d6c595c0fcf"},{"id":722393925,"name":"WogSwitchProbe-0.5.1.transfer.007","size":5242880,"digest":"sha256:9f70bc15cb6dc9f8223f5f43a02f855ee21f04949f2733f031fa2dc2ca84bbdd"},{"id":722393962,"name":"WogSwitchProbe-0.5.1.transfer.008","size":830528,"digest":"sha256:d41e6529c114f10bc4d8392c2c938b50f6b3a92cc62edcd7cadfb2d0335b598f"}]
          HEADERS = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "User-Agent": "WogSwitch-single-zip", "X-GitHub-Api-Version": "2022-11-28"}
          
          def api(path):
              req = urllib.request.Request("https://api.github.com" + path, headers={**HEADERS, "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def download(asset_id):
              req = urllib.request.Request(f"https://api.github.com/repos/{REPO}/releases/assets/{asset_id}", headers={**HEADERS, "Accept": "application/octet-stream"})
              try:
                  with urllib.request.build_opener(NoRedirect).open(req, timeout=90) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  if error.code not in (301, 302, 303, 307, 308):
                      raise
                  url = error.headers["Location"]
                  if urllib.parse.urlsplit(url).hostname not in {"release-assets.githubusercontent.com", "objects.githubusercontent.com"}:
                      raise RuntimeError("Unexpected asset download host")
                  # Signed CDN URL requires no repository token.
                  with urllib.request.urlopen(url, timeout=90) as response:
                      return response.read()
          
          output = Path(NAME)
          with output.open("wb") as stream:
              for part in PARTS:
                  data = download(part["id"])
                  assert len(data) == part["size"], part["name"]
                  assert "sha256:" + hashlib.sha256(data).hexdigest() == part["digest"], part["name"]
                  stream.write(data)
                  print("Verified part", part["name"])
          data = output.read_bytes()
          assert len(data) == 37530688
          assert hashlib.sha256(data).hexdigest() == EXPECTED
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
          release = api(f"/repos/{REPO}/releases/{RELEASE}")
          assert release["draft"] is True, "Expected the existing private draft"
          existing = next((a for a in release["assets"] if a["name"] == NAME), None)
          if existing is None:
              request = urllib.request.Request(
                  f"https://uploads.github.com/repos/{REPO}/releases/{RELEASE}/assets?name={NAME}",
                  data=data, method="POST", headers={**HEADERS, "Accept": "application/vnd.github+json", "Content-Type": "application/zip"})
              with urllib.request.urlopen(request, timeout=180) as response:
                  existing = json.load(response)
          assert existing["state"] == "uploaded"
          assert existing["size"] == len(data)
          assert existing["digest"] == "sha256:" + EXPECTED
          print("SINGLE ZIP VERIFIED:", existing["browser_download_url"])
          # Download the completed asset independently and verify the actual served bytes.
          roundtrip = download(existing["id"])
          assert hashlib.sha256(roundtrip).hexdigest() == EXPECTED
          assert len(roundtrip) == len(data)
          print("ROUNDTRIP DOWNLOAD VERIFIED:", len(roundtrip), "bytes; SHA256", EXPECTED)
          
