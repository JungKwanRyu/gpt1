name: Deliver WogSwitch single ZIP
on:
  push:
    branches:
      - codex/wogswitch-single-zip-delivery
    paths:
      - .github/workflows/wogswitch-single-zip.yml
permissions:
  contents: write
jobs:
  assemble-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Assemble, upload, and download-verify the single ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import hashlib, json, os, urllib.request, urllib.error, urllib.parse, zipfile
          from pathlib import Path
          
          REPO = "JungKwanRyu/gpt1"
          RELEASE = 425960140
          NAME = "WogSwitchProbe-0.5.11.zip"
          EXPECTED = "a1260c40d5c986fc0f241bfed54d98a219a2739d4d2be222be840f10dc56c5b5"
          PARTS = [{"id":730072898,"name":"WogSwitchProbe-0.5.11.clean-transfer.001","size":5242880,"digest":"sha256:28904bb09b2c4696d8cbe60be042c0f5b1cb6c8f484c40643faaaea33e792010"},{"id":730073006,"name":"WogSwitchProbe-0.5.11.clean-transfer.002","size":5242880,"digest":"sha256:4bc579a15671960ed6a06025cbb5383aa27c7cb0cb98c81e4722a5d29e34b72c"},{"id":730073060,"name":"WogSwitchProbe-0.5.11.clean-transfer.003","size":5242880,"digest":"sha256:77468babb6855c2f3036c6567cbf466d2bcddd7134b5447e42c08518d989a077"},{"id":730073132,"name":"WogSwitchProbe-0.5.11.clean-transfer.004","size":5242880,"digest":"sha256:f89f9bb4f77911df258bf848a5302a069462e1805ff55c26e4d411a9a7de68a6"},{"id":730073177,"name":"WogSwitchProbe-0.5.11.clean-transfer.005","size":5242880,"digest":"sha256:90c16732ddc49ceea92cdb4e2e62b470004962ad790611de0f95ad16b68b41b0"},{"id":730073248,"name":"WogSwitchProbe-0.5.11.clean-transfer.006","size":5242880,"digest":"sha256:5254a04cda09d533e9d9aee76eac7f1595ffa43cb87d1f502af8885257c7dd03"},{"id":730073292,"name":"WogSwitchProbe-0.5.11.clean-transfer.007","size":5242880,"digest":"sha256:6d4e4e292d07d90089fe94ef87e1fbc73c3ce92eeb3ca1571c8736f4ae7e91e1"},{"id":730073371,"name":"WogSwitchProbe-0.5.11.clean-transfer.008","size":2860068,"digest":"sha256:b7b12fb2915b803c4278f753699323ddbc7a778022c8a8fef422d0514e6ccf27"}]
          HEADERS = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "User-Agent": "WogSwitch-single-zip", "X-GitHub-Api-Version": "2022-11-28"}
          
          def api(path):
              req = urllib.request.Request("https://api.github.com" + path, headers={**HEADERS, "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req, timeout=90) as response:
                  return json.load(response)
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def download(asset_id):
              req = urllib.request.Request(f"https://api.github.com/repos/{REPO}/releases/assets/{asset_id}", headers={**HEADERS, "Accept": "application/octet-stream"})
              try:
                  with urllib.request.build_opener(NoRedirect).open(req, timeout=90) as response:
                      return response.read()
              except urllib.error.HTTPError as error:
                  if error.code not in (301, 302, 303, 307, 308):
                      raise
                  url = error.headers["Location"]
                  if urllib.parse.urlsplit(url).hostname not in {"release-assets.githubusercontent.com", "objects.githubusercontent.com"}:
                      raise RuntimeError("Unexpected asset download host")
                  # Signed CDN URL requires no repository token.
                  with urllib.request.urlopen(url, timeout=90) as response:
                      return response.read()
          
          output = Path(NAME)
          with output.open("wb") as stream:
              for part in PARTS:
                  data = download(part["id"])
                  assert len(data) == part["size"], part["name"]
                  assert "sha256:" + hashlib.sha256(data).hexdigest() == part["digest"], part["name"]
                  stream.write(data)
                  print("Verified part", part["name"])
          data = output.read_bytes()
          assert len(data) == 39560228
          assert hashlib.sha256(data).hexdigest() == EXPECTED
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None
          release = api(f"/repos/{REPO}/releases/{RELEASE}")
          assert release["draft"] is True, "Expected the existing private draft"
          existing = next((a for a in release["assets"] if a["name"] == NAME), None)
          if existing is None:
              request = urllib.request.Request(
                  f"https://uploads.github.com/repos/{REPO}/releases/{RELEASE}/assets?name={NAME}",
                  data=data, method="POST", headers={**HEADERS, "Accept": "application/vnd.github+json", "Content-Type": "application/zip"})
              with urllib.request.urlopen(request, timeout=180) as response:
                  existing = json.load(response)
          assert existing["state"] == "uploaded"
          assert existing["size"] == len(data)
          assert existing["digest"] == "sha256:" + EXPECTED
          print("SINGLE ZIP VERIFIED:", existing["browser_download_url"])
          # Download the completed asset independently and verify the actual served bytes.
          roundtrip = download(existing["id"])
          assert hashlib.sha256(roundtrip).hexdigest() == EXPECTED
          assert len(roundtrip) == len(data)
          print("ROUNDTRIP DOWNLOAD VERIFIED:", len(roundtrip), "bytes; SHA256", EXPECTED)
      - name: Stage the verified ZIP contents for chat attachment
        shell: python
        run: |
          import hashlib, zipfile
          from pathlib import Path
          source = Path("WogSwitchProbe-0.5.11.zip")
          assert hashlib.sha256(source.read_bytes()).hexdigest() == "a1260c40d5c986fc0f241bfed54d98a219a2739d4d2be222be840f10dc56c5b5"
          target = Path("download-package")
          with zipfile.ZipFile(source) as archive:
              assert archive.testzip() is None
              archive.extractall(target)
          for line in (target / "SHA256SUMS.txt").read_text().splitlines():
              digest, name = line.split("  ", 1)
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest, name
          print("CHAT ATTACHMENT CONTENTS VERIFIED")
      - uses: actions/upload-artifact@v4
        with:
          name: WogSwitchProbe-0.5.11-download
          path: download-package/
          include-hidden-files: true
          compression-level: 9
          retention-days: 90
