name: Audit real PC game patch and load
on:
  push:
    branches:
      - codex/wogswitch-game-loader
      - codex/wogswitch-startup
      - codex/wogswitch-runtime-fix
    paths:
      - tools/game-audit/**
      - tools/runtime-compat/**
      - tools/sdk9-smoke/**
      - tools/fetch_game_fixture.py
      - tools/prepare_game_files.py
      - tools/test_runtime_stdio.py
      - tools/test_runtime_exit.py
      - tools/test_native_audio.py
      - tools/test_native_raster.py
      - tools/test_pc_preparation.py
      - switch/runtime/**
      - tools/update_patch_identity.py
      - switch/managed/**
      - .github/workflows/wogswitch-game-audit.yml
permissions:
  contents: read
jobs:
  game-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
      - name: Restore the verified original Wog DLLs
        shell: python
        run: |
          import hashlib, urllib.request
          from pathlib import Path
          root = "https://raw.githubusercontent.com/sonicusers/twgios/573576b96fda40ee88a6a2b384de6d87743b73a7/WogiOS_project/libs/"
          target = Path("switch/managed/lib")
          target.mkdir(parents=True, exist_ok=True)
          for name, expected in [
              ("WogShim.dll", "c8f9909fd0d78e2d23cfe58e57838c44d590d5c9ddf530d044e614af9bb786aa"),
              ("WogPatcher.dll", "0ef54f0b771eb28f4678ce1fa4c3bb73afce49cdf29fabc1299448e20a52f5e8")]:
              with urllib.request.urlopen(root + name, timeout=90) as response:
                  data = response.read()
              assert hashlib.sha256(data).hexdigest() == expected
              (target / name).write_bytes(data)
      - name: Verify patch-code cache identity
        run: python3 tools/update_patch_identity.py --check
      - name: Adapt the verified patcher to the Switch BCL
        run: dotnet run --project tools/runtime-compat/RuntimeCompat.csproj -c Release -- switch/managed/lib/WogPatcher.dll output/game-audit/runtime-compatibility.json
      - name: Fetch the pinned public PC release for compatibility testing
        run: python3 tools/fetch_game_fixture.py
      - name: Test the SD input preparation helper on the real package
        run: python3 tools/prepare_game_files.py --package work/game-fixture/game.nupkg --destination work/prepared-game/release
      - name: Restore the exact public Switch BCL for API inspection
        shell: bash
        run: |
          git init work/forge
          git -C work/forge remote add origin https://github.com/BennettNotFound/NroForge.git
          git -C work/forge fetch --depth 1 origin e41f2e68b212737da81ddc97fe5c7b881bb125e8
          git -C work/forge checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import os, sys, shutil
          from pathlib import Path
          repo = Path('work/forge').resolve()
          sys.path.insert(0, str(repo))
          from scripts.sdk import ensure
          sdk = ensure(repo, repo / '.nroforge/sdk')
          mono = sdk / 'sdk/mono/artifacts/bin'
          target = Path('work/sdk-runtime9').resolve()
          target.mkdir(parents=True, exist_ok=True)
          for file in (mono / 'runtime/net9.0-libnx-Debug-arm64').glob('*.dll'):
              shutil.copy2(file, target / file.name)
          shutil.copy2(mono / 'mono/libnx.arm64.Debug/System.Private.CoreLib.dll', target)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('WOG_SDK_MONO=' + str(target) + '\n')
          PY
      - name: Reproduce disposed-console stdio and verify the native file redirect
        shell: bash
        run: python3 tools/test_runtime_stdio.py --nroforge work/forge | tee native-stdio-smoke.log
      - name: Exercise streaming PCM and the actual audio driver with mocked audout
        shell: bash
        run: python3 tools/test_native_audio.py --output output/game-audit | tee native-audio-smoke.log
      - name: Verify EGL teardown and the clean homebrew exit without a console refresh
        run: python3 tools/test_runtime_exit.py --nroforge work/forge | tee native-exit-smoke.log
      - name: Build the actual host for Switch BCL API inspection
        run: dotnet publish switch/managed/WogSwitch.Managed.csproj -c Release -o work/managed-api-audit
      - name: Compare native raster clipping and opaque alpha under UBSan
        run: python3 tools/test_native_raster.py | tee native-raster-smoke.log
      - name: Build the actual native backdrop kernel for managed/native pixel equivalence
        run: gcc -shared -fPIC -O2 -fsanitize=undefined -fno-sanitize-recover=all switch/runtime/raster.c switch/runtime/audio_pcm.c -lm -o work/libWogRaster.so
      - name: Build the Horizon overwrite-rename behavior test
        run: gcc -shared -fPIC -O2 tools/game-audit/libnx_rename_semantics.c -ldl -o work/libnx-rename-semantics.so
      - name: Patch and load the real PC DLLs without entering the game
        shell: bash
        run: WOG_RASTER_TEST_LIB="$PWD/work/libWogRaster.so" LD_PRELOAD="$PWD/work/libnx-rename-semantics.so" WOG_TEST_LIBNX_RENAME=1 dotnet run --project tools/game-audit/GameAudit.csproj -c Release -- work/prepared-game/release output/game-audit | tee game-audit.log
      - name: Execute shader and actual patched inline-array layout on .NET 9
        shell: bash
        run: dotnet run --project tools/sdk9-smoke/Sdk9Smoke.csproj -c Release -- output/game-audit switch/managed/lib/WogShim.dll | tee sdk9-execution-smoke.log
      - name: Exercise the optional PC preparation tool and relocatable SD cache
        shell: bash
        run: python3 tools/test_pc_preparation.py --host work/managed-api-audit --fixture work/prepared-game/release --output output/pc-preparation | tee pc-preparation-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WogSwitch-real-game-audit
          path: |
            game-audit.log
            sdk9-execution-smoke.log
            native-stdio-smoke.log
            native-exit-smoke.log
            native-audio-smoke.log
            native-raster-smoke.log
            pc-preparation-smoke.log
            output/pc-preparation/*.log
            output/game-audit/*.wav
            output/game-audit/*.json
            output/game-audit/*.txt
