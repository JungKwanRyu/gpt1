name: Build WogSwitch managed host
on:
  push:
    branches:
      - codex/wogswitch-managed-host
    paths:
      - switch/managed/**
      - .github/workflows/wogswitch-managed.yml
permissions:
  contents: read
jobs:
  managed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore hash-pinned DLLs from the public upstream commit
        shell: python
        run: |
          import hashlib, urllib.request
          from pathlib import Path
          root = "https://raw.githubusercontent.com/sonicusers/twgios/573576b96fda40ee88a6a2b384de6d87743b73a7/WogiOS_project/libs/"
          target = Path("switch/managed/lib")
          target.mkdir(parents=True, exist_ok=True)
          for name, expected in [
              ("WogShim.dll", "c8f9909fd0d78e2d23cfe58e57838c44d590d5c9ddf530d044e614af9bb786aa"),
              ("WogPatcher.dll", "0ef54f0b771eb28f4678ce1fa4c3bb73afce49cdf29fabc1299448e20a52f5e8")]:
              with urllib.request.urlopen(root + name, timeout=90) as response:
                  raw = response.read()
              assert hashlib.sha256(raw).hexdigest() == expected
              (target / name).write_bytes(raw)
              print("Verified original public DLL:", name)
          
      - name: Build the platform-neutral managed host
        run: dotnet publish switch/managed/WogSwitch.Managed.csproj -c Release -o output/managed
      - name: Execute original Wog methods and Skia raster smoke checks on Linux
        run: dotnet output/managed/WogSwitch.Managed.dll --desktop-smoke | tee output/desktop-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: WogSwitch-managed-0.2
          path: |
            output/managed/*.dll
            output/managed/*.json
            output/desktop-smoke.log
