name: Build WogSwitch managed host
on:
  push:
    branches:
      - codex/wogswitch-managed-host
      - codex/wogswitch-skia
      - codex/wogswitch-game-loader
      - codex/wogswitch-startup
      - codex/wogswitch-runtime-fix
    paths:
      - switch/managed/**
      - tools/runtime-compat/**
      - .github/workflows/wogswitch-managed.yml
permissions:
  contents: read
jobs:
  managed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore hash-pinned DLLs from the public upstream commit
        shell: python
        run: |
          import hashlib, urllib.request
          from pathlib import Path
          root = "https://raw.githubusercontent.com/sonicusers/twgios/573576b96fda40ee88a6a2b384de6d87743b73a7/WogiOS_project/libs/"
          target = Path("switch/managed/lib")
          target.mkdir(parents=True, exist_ok=True)
          for name, expected in [
              ("WogShim.dll", "c8f9909fd0d78e2d23cfe58e57838c44d590d5c9ddf530d044e614af9bb786aa"),
              ("WogPatcher.dll", "0ef54f0b771eb28f4678ce1fa4c3bb73afce49cdf29fabc1299448e20a52f5e8")]:
              with urllib.request.urlopen(root + name, timeout=90) as response:
                  raw = response.read()
              assert hashlib.sha256(raw).hexdigest() == expected
              (target / name).write_bytes(raw)
              print("Verified original public DLL:", name)
          
      - name: Adapt the verified original patcher to the Switch BCL
        run: dotnet run --project tools/runtime-compat/RuntimeCompat.csproj -c Release -- switch/managed/lib/WogPatcher.dll output/managed/runtime-compatibility.json
      - name: Build the platform-neutral managed host
        run: dotnet publish switch/managed/WogSwitch.Managed.csproj -c Release -o output/managed
      - name: Fetch the pinned Korean font and its OFL license
        shell: python
        run: |
          import hashlib, urllib.request
          from pathlib import Path
          root = "https://raw.githubusercontent.com/google/fonts/86aced91de05cd4f96a06838124cca45be337b2b/ofl/nanumgothic/"
          target = Path("output/managed/assets")
          target.mkdir(parents=True, exist_ok=True)
          for name, destination, expected in [
              ("NanumGothic-Regular.ttf", "NanumGothic.ttf", "2aa2b20905b4136808a0126d8e36e5c0f576715c"),
              ("OFL.txt", "NanumGothic-OFL.txt", "69ff40157d0bba4c65e4ecf77564e1f01d0b02a5")]:
              with urllib.request.urlopen(root + name, timeout=90) as response:
                  data = response.read()
              blob = b"blob " + str(len(data)).encode() + b"\0" + data
              assert hashlib.sha1(blob).hexdigest() == expected
              (target / destination).write_bytes(data)
              print("Verified Korean font asset:", destination)
      - name: Execute original Wog methods and image/Korean raster checks on Linux
        shell: bash
        run: dotnet output/managed/WogSwitch.Managed.dll --desktop-smoke | tee output/desktop-smoke.log
      - uses: actions/upload-artifact@v4
        with:
          name: WogSwitch-managed-0.5.8
          path: |
            output/managed/*.dll
            output/managed/*.json
            output/desktop-smoke.log
            output/managed/assets/
            output/managed/render-desktop.png
            output/managed/render-dialog-desktop.png

  pc-preparation-windows:
    needs: managed
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: WogSwitch-managed-0.5.8
          path: work/published
      - name: Fetch and prepare the pinned public fixture
        run: |
          python tools/fetch_game_fixture.py
          python tools/prepare_game_files.py --package work/game-fixture/game.nupkg --destination work/prepared-game/release
      - name: Test the actual PC tool and moved SD cache on Windows
        run: python tools/test_pc_preparation.py --host work/published/managed --fixture work/prepared-game/release --output output/pc-preparation-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WogSwitch-PC-preparation-Windows
          path: output/pc-preparation-windows/*.log

