name: Build Switch SkiaSharp native
on:
  push:
    branches:
      - codex/wogswitch-skia
      - codex/wogswitch-runtime-fix
    paths:
      - tools/build_skia_native.py
      - .github/workflows/wogswitch-skia.yml
permissions:
  contents: read
jobs:
  skia:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:20260219
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare host build tools
        run: apt-get update && apt-get install -y python3 ninja-build build-essential ca-certificates git
      - uses: actions/cache/restore@v4
        with:
          path: work/skia
          key: nxskia-30ab-gcc15-${{ github.run_id }}
          restore-keys: nxskia-30ab-gcc15-
      - name: Build the real pinned SkiaSharp C API for devkitA64
        shell: bash
        run: python3 tools/build_skia_native.py --jobs 2 2>&1 | tee skia-build.log
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/skia
          key: nxskia-30ab-gcc15-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WogSwitch-SkiaSharp-native
          path: |
            output/skia-native/
            skia-build.log
